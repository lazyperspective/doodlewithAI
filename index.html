<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doodle with Agents</title>
<link rel="icon" href="docs/icon/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/book.css">
</head>
<body>
<main id="desk">
  <div id="book">
    <div id="board"></div>
    <div id="stack"></div>
    <div id="sheet">
      <canvas id="paper"></canvas>
      <canvas id="ink"></canvas>
      <div id="grain"></div>
      <div id="dom"></div>
      <svg id="pen" viewBox="0 0 120 120" aria-hidden="true"><g transform="rotate(-38 0 0)"><path d="M0 0 L9 -4 L9 4 Z" fill="#2b2622"/><path d="M9 -4 L22 -6 L22 6 L9 4 Z" fill="#e8c9a0"/><rect x="22" y="-6" width="78" height="12" fill="#d9a441"/><rect x="22" y="-6" width="78" height="4" fill="#efc25e"/><rect x="100" y="-6" width="8" height="12" fill="#b9b3a8"/><rect x="108" y="-6" width="10" height="12" rx="3" fill="#d88a8a"/></g></svg>
      <div id="loading"><span>sharpening the pencil…</span></div>
    </div>
    <canvas id="rings"></canvas>
  </div>
</main>
<footer id="bar">
  <div id="caption"><span id="cap-no"></span><b id="cap-title"></b><span id="cap-note"></span></div>
  <div id="tools">
    <button id="prev" title="Previous page (←)">‹ prev</button>
    <button id="toc" title="Contents">☰ contents</button>
    <span class="sep"></span>
    <button id="draw" class="draw-only" title="Watch it being drawn from a blank page (D)">✎ draw from blank</button>
    <span id="speeds" title="Drawing speed (1–5)"><button data-v="0.5" class="draw-only">½×</button><button data-v="1" class="draw-only">1×</button><button data-v="2" class="draw-only">2×</button><button data-v="4" class="draw-only">4×</button><button data-v="8" class="draw-only">8×</button></span>
    <button id="pause" class="draw-only" title="Pause (P)">⏸ pause</button>
    <button id="sound" title="Sound">♪ sound on</button>
    <button id="finish" class="draw-only" title="Finish the drawing (Space)">⏭ finish</button>
    <span class="sep"></span>
    <label id="auto" title="Start each plate from a blank page when you turn to it"><input type="checkbox" id="autoplay"> draw as I turn</label>
    <span class="sep"></span>
    <span id="pageno"></span>
    <button id="next" title="Next page (→)">next ›</button>
  </div>
  <div id="track"><div id="progress"></div></div>
</footer>
<script src="src/engine.js"></script>
<script src="src/engine3d.js"></script>
<script src="src/kit.js"></script>
<script src="src/doodle.js"></script>
<script src="src/shading.js"></script>
<script src="scenes/manifest.js"></script>
<script src="src/load.js" data-viewer="src/book.js"></script>
</body>
</html>
